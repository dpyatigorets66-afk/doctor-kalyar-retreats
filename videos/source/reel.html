<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/f.css">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Manrope,sans-serif}
  canvas{position:absolute;inset:0}
  .abs{position:absolute}
  #bars{left:70px;right:70px;top:64px;height:6px;display:flex;gap:10px}
  #bars div{flex:1;border-radius:3px;overflow:hidden}
  #bars i{display:block;height:100%;width:0}
  #kicker{left:70px;top:112px;font:600 30px Manrope;letter-spacing:.2em;text-transform:uppercase}
  #tag{right:70px;top:100px;font:600 28px Manrope;padding:14px 26px;border-radius:40px;border:2px solid}
  #iconwrap{left:0;right:0;top:230px;height:660px}
  #icon{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px}
  #rings{position:absolute;left:50%;top:50%;width:0;height:0}
  #head{left:80px;right:80px;bottom:800px;text-align:center;font:500 124px/1.02 'Cormorant Garamond';letter-spacing:-.01em}
  #head em{font-style:italic;font-weight:400}
  #sub{left:80px;right:80px;top:1140px;text-align:center;font:italic 400 58px 'Cormorant Garamond'}
  #chips{left:80px;right:80px;top:1150px;display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
  .chip{font:600 36px Manrope;padding:18px 32px;border-radius:50px}
  #cap{left:120px;right:120px;top:1350px;text-align:center;font:600 46px/1.32 Manrope}
  #cap span{display:inline-block;white-space:pre}
  #foot{left:0;right:0;top:1600px;text-align:center;font:600 28px Manrope;letter-spacing:.22em;text-transform:uppercase}
  #outro{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #outro .n{font:500 150px/1 'Cormorant Garamond'}
  #outro .s{font:600 34px Manrope;letter-spacing:.24em;text-transform:uppercase;margin-top:34px}
  #outro .h{font:800 44px Manrope;margin-top:70px;padding:22px 46px;border-radius:60px}
  #outro .d{font:400 28px Manrope;margin-top:60px;opacity:.7}
</style></head>
<body><div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <div id="main" class="abs" style="inset:0"><div id="bars" class="abs"></div>
  <div id="kicker" class="abs"></div>
  <div id="tag" class="abs"></div>
  <div id="iconwrap" class="abs"><svg id="rings" style="overflow:visible"></svg><svg id="icon" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round"></svg></div>
  <div id="head" class="abs"></div>
  <div id="sub" class="abs"></div>
  <div id="chips" class="abs"></div>
  <div id="cap" class="abs"></div>
  <div id="foot" class="abs">Доктор Кальяр · Аюрведа</div></div>
  <div id="outro" class="abs"><div class="n">Доктор Кальяр</div><div class="s">йога · аюрведа · медитация</div><div class="h">@doctorkalyar</div><div class="d">Озвучка создана с помощью ИИ</div></div>
  <canvas id="grain" width="540" height="960" style="width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.22"></canvas>
</div>
<script>
// ---------- line-art icons (viewBox 400) ----------
const ICONS = {
  scroll:`<path d="M90 110h190a30 30 0 0 1 30 30v170H120a30 30 0 0 1-30-30z"/><path d="M90 110a30 30 0 0 0-30 30v20h60"/><path d="M310 310a30 30 0 0 0 30-30v-20h-30"/><path d="M140 170h120M140 210h120M140 250h80"/>`,
  scraper:`<path d="M110 90v120a90 90 0 0 0 180 0V90"/><path d="M110 90h-18M290 90h18"/><path d="M150 320c30 20 70 20 100 0"/><path d="M200 330v-40"/><path d="M185 300l15-14 15 14"/>`,
  sunrise:`<path d="M60 290h280"/><path d="M110 290a90 90 0 0 1 180 0"/><path d="M200 150v-40M120 185l-28-28M280 185l28-28M85 250H50M315 250h35"/><path d="M110 330h180M150 360h100"/>`,
  eye:`<path d="M40 200c45-70 100-100 160-100s115 30 160 100c-45 70-100 100-160 100S85 270 40 200z"/><circle cx="200" cy="200" r="55"/><circle cx="200" cy="200" r="18"/>`,
  moon:`<path d="M250 80a130 130 0 1 0 90 190A110 110 0 0 1 250 80z"/><path d="M110 110l8 18 18 8-18 8-8 18-8-18-18-8 18-8zM300 330l6 12 12 6-12 6-6 12-6-12-12-6 12-6z"/>`,
  foot:`<path d="M175 330c-50 0-70-40-60-100s10-110 50-130 80 10 80 60-10 60 0 100-20 70-70 70z"/><circle cx="265" cy="80" r="16"/><circle cx="292" cy="112" r="12"/><circle cx="305" cy="148" r="10"/><path d="M300 210c10 18 10 30 0 40-10-10-10-22 0-40z"/>`,
  oil:`<path d="M200 50c40 60 90 110 90 170a90 90 0 0 1-180 0c0-60 50-110 90-170z"/><path d="M160 230a40 40 0 0 0 40 40"/><path d="M90 360h220M130 330c20 10 120 10 140 0"/>`,
  phone:`<rect x="130" y="60" width="140" height="280" rx="26"/><path d="M180 90h40M190 310h20"/><path d="M70 60l260 280"/>`,
  stars:`<path d="M200 70l22 48 52 6-38 36 10 52-46-26-46 26 10-52-38-36 52-6z"/><path d="M90 250l8 18 18 8-18 8-8 18-8-18-18-8 18-8zM310 260l8 18 18 8-18 8-8 18-8-18-18-8 18-8z"/><path d="M120 350h160"/>`,
  ginger:`<path d="M60 250c0-30 30-45 55-35 5-35 45-45 65-20 15-25 55-25 65 5 25-15 65 0 60 35 30 5 35 45 5 55-10 25-50 30-65 10-20 20-60 20-75-5-25 15-65 10-75-15-25 0-35-20-35-30z"/><path d="M130 225c8 15 8 35 0 50M200 215c8 18 8 40 0 58M270 225c8 15 8 35 0 50"/><path d="M200 200c0-40 10-80 40-110M210 150c-25-15-45-15-60-5"/>`,
  flame:`<path d="M200 60c30 60 100 90 100 170a100 100 0 0 1-200 0c0-50 30-70 50-100 10 40 30 50 40 50-10-40 0-80 10-120z"/><path d="M200 330a45 45 0 0 1-45-45c0-30 30-45 45-75 15 30 45 45 45 75a45 45 0 0 1-45 45z"/>`,
  heart:`<path d="M200 335c-90-60-140-110-140-165a70 70 0 0 1 140-35 70 70 0 0 1 140 35c0 55-50 105-140 165z"/><path d="M95 205h50l20-40 30 80 22-45 18 5h70"/>`,
  bookmark:`<path d="M120 60h160v290l-80-60-80 60z"/><path d="M165 150l25 25 50-50"/>`,
  sunarc:`<path d="M40 300h320"/><path d="M60 300a140 140 0 0 1 280 0" stroke-dasharray="0.02 0.03"/><circle id="sundot" cx="200" cy="160" r="30"/>`,
  zenith:`<circle cx="200" cy="130" r="50"/><path d="M200 40v-20M200 240v-20M110 130h-20M310 130h20M136 66l-14-14M264 66l14-14M136 194l-14 14M264 194l14 14"/><path d="M200 380c-40 0-65-25-65-60 0-30 25-45 35-70 10 25 20 30 25 30-5-25 0-40 5-60 20 40 65 55 65 100 0 35-25 60-65 60z"/>`,
  plate:`<circle cx="200" cy="210" r="120"/><circle cx="200" cy="210" r="80"/><path d="M40 90v80a20 20 0 0 0 40 0V90M60 90v250"/><path d="M340 90c-30 20-30 90 0 110v140"/>`,
  clock:`<circle cx="200" cy="200" r="140"/><path d="M200 110v90l60 40"/><path d="M200 70v14M200 316v14M70 200h14M316 200h14"/>`,
  week:`<rect x="60" y="90" width="280" height="250" rx="24"/><path d="M60 150h280M130 60v50M270 60v50"/><circle cx="110" cy="200" r="10"/><circle cx="170" cy="200" r="10"/><circle cx="230" cy="200" r="10"/><circle cx="290" cy="200" r="10"/><circle cx="110" cy="270" r="10"/><circle cx="170" cy="270" r="10"/><circle cx="230" cy="270" r="10"/>`,
};

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let R, T, built=false;
function build(cfg){
  R=cfg; T=R.theme;
  document.body.style.color=T.ink;
  $('kicker').textContent=R.kicker; $('kicker').style.color=T.accent;
  $('foot').style.color=T.muted;
  $('bars').innerHTML=R.scenes.map(()=>`<div style="background:${T.track}"><i style="background:${T.accent}"></i></div>`).join('');
  $('head').style.color=T.ink; $('sub').style.color=T.accent; $('cap').style.color=T.ink;
  $('tag').style.color=T.accent; $('tag').style.borderColor=T.accent;
  const o=$('outro'); o.style.color=T.ink; o.querySelector('.h').style.background=T.accent; o.querySelector('.h').style.color=T.onAccent;
  // rings
  let r='';
  for(let i=0;i<5;i++) r+=`<circle r="${170+i*62}" stroke="${T.accent}" stroke-width="${i==2?2.5:1.5}" fill="none" ${i%2?'stroke-dasharray="4 16"':''}/>`;
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2;r+=`<circle cx="${Math.cos(a)*300}" cy="${Math.sin(a)*300}" r="5" fill="${T.accent}"/>`}
  $('rings').innerHTML=`<g id="rg">${r}</g>`;
  // grain
  const g=$('grain').getContext('2d'), im=g.createImageData(540,960), rnd=mulberry(7);
  for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}
  g.putImageData(im,0,0);
  built=true;
}

function drawBg(t){
  const c=$('bg').getContext('2d');
  const g=c.createLinearGradient(0,0,0,1920); g.addColorStop(0,T.bg[0]); g.addColorStop(1,T.bg[1]);
  c.fillStyle=g; c.fillRect(0,0,1080,1920);
  T.blobs.forEach((b,i)=>{
    const x=540+Math.sin(t*b.sp+i*2.1)*b.ax, y=b.y+Math.cos(t*b.sp*.8+i)*b.ay, r=b.r*(1+.08*Math.sin(t*.7+i));
    const rg=c.createRadialGradient(x,y,0,x,y,r); rg.addColorStop(0,b.c); rg.addColorStop(.55,b.c.replace(/[\d.]+\)$/,m=>(parseFloat(m)*.45)+')')); rg.addColorStop(1,b.c.replace(/[\d.]+\)$/,'0)'));
    c.fillStyle=rg; c.fillRect(0,0,1080,1920);
  });
}

function sceneAt(t){let k=0;R.scenes.forEach((s,i)=>{if(t>=s.t)k=i});return k}

function renderFrame(t){
  const dur=R.audioEnd, outroT=t-dur;
  drawBg(t);
  const gr=$('grain'); gr.style.transform=`translate(${(Math.floor(t*24)*37)%9-4}px,${(Math.floor(t*24)*53)%9-4}px)`;

  // outro crossfade
  const oa=ease(outroT/0.8);
  const main=1-oa;
  $('main').style.opacity=main; $('main').style.filter=oa>0?`blur(${oa*14}px)`:'none';
  const o=$('outro'); o.style.opacity=oa; o.style.transform=`scale(${lerp(1.06,1,oa)})`; o.style.filter=`blur(${(1-oa)*12}px)`;

  // bars
  const bars=$('bars').children;
  R.scenes.forEach((s,i)=>{const e=i+1<R.scenes.length?R.scenes[i+1].t:dur; bars[i].firstChild.style.width=(clamp((t-s.t)/(e-s.t))*100)+'%'});

  const k=sceneAt(t), S=R.scenes[k], ts=t-S.t;
  const next=k+1<R.scenes.length?R.scenes[k+1].t:dur+10, te=next-t;
  const inP=ease(ts/0.9), outP=k+1<R.scenes.length?ease(1-te/0.45):1;
  const vis=Math.min(inP, k+1<R.scenes.length?clamp(te/0.45):1);

  // tag
  const tg=$('tag'); tg.textContent=S.tag||''; tg.style.display=S.tag?'block':'none'; tg.style.opacity=vis;

  // icon draw-on
  const ic=$('icon');
  if(ic.dataset.k!=k){ic.innerHTML=ICONS[S.icon];ic.dataset.k=k;
    ic.querySelectorAll('path,circle,rect').forEach(p=>{if(p.id==='sundot')return;p.setAttribute('pathLength','1');if(!p.getAttribute('stroke-dasharray'))p.setAttribute('stroke-dasharray','1 1');p.setAttribute('stroke',T.ink);p.setAttribute('stroke-width','7')});}
  const draw=ease(ts/1.6);
  ic.querySelectorAll('[pathLength]').forEach((p,i)=>{
    const d=clamp(draw*1.3-i*0.06);
    if(p.getAttribute('stroke-dasharray')==='1 1') p.setAttribute('stroke-dashoffset',1-d); else p.style.opacity=d;
  });
  const sd=ic.querySelector('#sundot');
  if(sd){const a=Math.PI*(1-clamp(ts/Math.max(1,(next-S.t)-.5))); sd.setAttribute('cx',200+Math.cos(a)*140); sd.setAttribute('cy',300-Math.sin(a)*140); sd.setAttribute('fill',T.accent); sd.setAttribute('stroke','none');}
  const fl=Math.sin(t*1.3)*10;
  ic.style.transform=`translateY(${fl+(1-inP)*40-outP*30}px) scale(${lerp(.86,1,inP)})`;
  ic.style.opacity=vis; ic.style.filter=`blur(${(1-vis)*10}px)`;
  $('rg').setAttribute('transform',`rotate(${t*6}) scale(${lerp(.7,1,ease(ts/1.4))})`);
  $('rings').style.opacity=.28*vis;

  // headline: letters rise
  const hd=$('head');
  if(hd.dataset.k!=k){hd.dataset.k=k;
    hd.innerHTML=S.head.split(' ').map(w=>`<span style="display:inline-block;white-space:nowrap">${w.startsWith('*')?`<em style="color:${T.accent}">${w.slice(1)}</em>`:w}</span>`).join(' ');}
  [...hd.children].forEach((w,i)=>{const p=ease((ts-.15-i*.12)/.7); w.style.opacity=Math.min(p,vis); w.style.transform=`translateY(${(1-p)*60-outP*20}px)`; w.style.filter=`blur(${(1-p)*14}px)`});

  // sub / chips
  const sb=$('sub'); sb.textContent=S.sub||''; const sp=ease((ts-.6)/.8); sb.style.opacity=Math.min(sp,vis); sb.style.transform=`translateY(${(1-sp)*30}px)`;
  const ch=$('chips');
  if(ch.dataset.k!=k){ch.dataset.k=k; ch.innerHTML=(S.chips||[]).map(c=>`<div class="chip" style="background:${T.chipBg};color:${T.chipInk}">${c[1]}</div>`).join('')}
  [...ch.children].forEach((c,i)=>{const p=ease((t-S.chips[i][0])/.5); c.style.opacity=Math.min(p,vis); c.style.transform=`translateY(${(1-p)*30}px) scale(${lerp(.9,1,p)})`});

  // captions (karaoke)
  const cap=$('cap'); let seg=null;
  R.caps.forEach(c=>{if(t>=c[0]-.05&&t<c[1]+.25)seg=c});
  if(!seg){cap.style.opacity=0}else{
    if(cap.dataset.s!=seg[0]){cap.dataset.s=seg[0]; cap.innerHTML=seg[2].split(' ').map(w=>`<span>${w} </span>`).join('')}
    const ws=[...cap.children], n=ws.length, len=ws.map(w=>w.textContent.length), tot=len.reduce((a,b)=>a+b,0);
    let acc=0; const p=clamp((t-seg[0])/(seg[1]-seg[0]));
    ws.forEach((w,i)=>{const st=acc/tot; acc+=len[i]; const on=p>=st;
      const q=ease((p-st)*(seg[1]-seg[0])/.25);
      w.style.opacity=on?lerp(.35,1,q):.35; w.style.color=seg[3]&&seg[3].includes(i)?T.accent:T.ink;
      w.style.transform=`translateY(${on?(1-q)*6:6}px)`;});
    const fi=ease((t-seg[0]+.05)/.2), fo=clamp((seg[1]+.25-t)/.2);
    cap.style.opacity=Math.min(fi,fo);
  }
}
window.build=build; window.renderFrame=renderFrame;
</script></body></html>
